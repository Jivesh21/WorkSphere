spring:
  datasource:
    url: jdbc:h2:mem:worksphere;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  jwt:
    secret: test-secret-must-be-at-least-thirty-two-characters-long
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
